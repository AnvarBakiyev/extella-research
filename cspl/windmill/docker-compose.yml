# Опыт 21, шаг 2: Windmill (открытая редакция) локально, только на 127.0.0.1. Учётные данные — стандартные для локальной установки из документации.
name: op21-windmill
services:
  db:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: changeme, POSTGRES_DB: windmill }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, timeout: 5s, retries: 20 }
  server:
    image: ghcr.io/windmill-labs/windmill:main
    environment: { DATABASE_URL: "postgres://postgres:changeme@db/windmill?sslmode=disable", MODE: server }
    ports: ["127.0.0.1:8300:8000"]
    depends_on: { db: { condition: service_healthy } }
  worker:
    image: ghcr.io/windmill-labs/windmill:main
    environment: { DATABASE_URL: "postgres://postgres:changeme@db/windmill?sslmode=disable", MODE: worker, WORKER_GROUP: default }
    volumes: ["<repo>/data/generated:/data:ro"]
    depends_on: { db: { condition: service_healthy } }
